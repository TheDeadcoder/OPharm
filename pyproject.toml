[project]
name = "opharm"
version = "0.1.0"
description = "Operational harm as a blind spot of content-harm safety in small LLM agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14,<2.15",
    "transformers>=5.17,<5.18",
    "accelerate>=1.15,<1.16",
    "safetensors>=0.8,<0.9",
    "huggingface-hub",
    "jinja2",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn>=1.9.1,<1.10",
    "matplotlib",
    "pyyaml",
    "mlx>=0.32.2,<0.33; sys_platform == 'darwin'",
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin'",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
